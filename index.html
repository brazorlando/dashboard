<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0a0e1a;color:#e6edf7;min-height:100vh}
  .wrap{max-width:1400px;margin:0 auto;padding:24px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #1e293b}
  .logo{font-size:22px;font-weight:700;color:#60a5fa}
  .logo span{color:#e6edf7}
  .btn{background:#1e40af;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
  .btn:hover{background:#2563eb}
  .btn.secondary{background:#1e293b}
  .btn.secondary:hover{background:#334155}
  .grid{display:grid;gap:16px;margin-bottom:24px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .card{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:20px}
  .card .label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .card .value{font-size:28px;font-weight:700;color:#fff}
  .card .sub{font-size:13px;color:#94a3b8;margin-top:6px}
  .card.hl-blue{border-color:#2563eb;background:linear-gradient(180deg,#111827,#0f1c33)}
  .card.hl-green{border-color:#059669;background:linear-gradient(180deg,#111827,#0a2318)}
  .card.hl-amber{border-color:#d97706;background:linear-gradient(180deg,#111827,#2a1a06)}
  .card.hl-red{border-color:#dc2626;background:linear-gradient(180deg,#111827,#2a0a0a)}
  .section{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:20px;margin-bottom:24px}
  .section h2{font-size:16px;margin-bottom:16px;color:#94a3b8;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #1e293b;font-size:14px}
  th{color:#94a3b8;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  tr:hover td{background:#1a2332}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase}
  .badge.ok{background:#065f46;color:#6ee7b7}
  .badge.warn{background:#78350f;color:#fcd34d}
  .badge.err{background:#7f1d1d;color:#fca5a5}
  .badge.info{background:#1e3a8a;color:#93c5fd}
  .login{max-width:420px;margin:100px auto;text-align:center}
  .login h1{font-size:26px;margin-bottom:24px}
  .login input{width:100%;padding:14px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e6edf7;font-size:14px;margin-bottom:16px}
  .login input:focus{outline:none;border-color:#2563eb}
  .login button{width:100%;padding:14px;font-size:15px}
  .empty{color:#64748b;text-align:center;padding:40px 20px;font-size:14px}
  .loading{color:#64748b;text-align:center;padding:40px}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid #334155;border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
  .updated{font-size:12px;color:#64748b;text-align:right;margin-bottom:12px}
  .tenant-row{cursor:pointer}
  .rank-num{font-weight:700;color:#fbbf24;width:30px}
  .mb-link{color:#60a5fa;text-decoration:none}
  .mb-link:hover{text-decoration:underline}
  @media(max-width:600px){.card .value{font-size:22px}.wrap{padding:16px}th,td{padding:8px 4px;font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════
//   API → usa o proxy do Vercel (/api) que fala com o bot
//   Não uses o URL direto do bot aqui (mixed content)
// ═══════════════════════════════════════════════════════════
const API = "/api/proxy";

const app = document.getElementById("app");
const path = window.location.pathname;
const LS_KEY = "dash_owner_token";

// ─────────────── ROUTER ───────────────
if (path.startsWith("/u/")) {
  const token = path.slice(3);
  renderTenant(token);
} else {
  renderOwner();
}

// ─────────────── HELPER FETCH ───────────────
async function apiGet(endpoint, params = {}) {
  const qs = new URLSearchParams({ endpoint, ...params }).toString();
  const url = `/api/proxy?${qs}`;
  console.log("[GET]", url);
  const r = await fetch(url);
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`HTTP ${r.status}: ${txt.slice(0, 120)}`);
  }
  return await r.json();
}

// ═══════════════════════════════════════════════════════════
//   OWNER DASHBOARD
// ═══════════════════════════════════════════════════════════
function renderOwner() {
  const savedToken = localStorage.getItem(LS_KEY) || "";
  if (!savedToken) {
    renderOwnerLogin();
  } else {
    loadOwnerData(savedToken);
  }
}

function renderOwnerLogin() {
  app.innerHTML = `
    <div class="wrap">
      <div class="login">
        <h1>📊 <span style="color:#60a5fa">Owner</span> Dashboard</h1>
        <input type="password" id="tok" placeholder="Token de acesso" autofocus>
        <button class="btn" id="btn-login">Entrar</button>
        <div id="err" style="color:#fca5a5;margin-top:12px;font-size:13px"></div>
      </div>
    </div>`;
  document.getElementById("btn-login").onclick = () => {
    const t = document.getElementById("tok").value.trim();
    if (!t) return;
    localStorage.setItem(LS_KEY, t);
    loadOwnerData(t);
  };
  document.getElementById("tok").onkeydown = (e) => {
    if (e.key === "Enter") document.getElementById("btn-login").click();
  };
}

async function loadOwnerData(token) {
  app.innerHTML = `<div class="wrap"><div class="loading"><span class="spinner"></span>A carregar…</div></div>`;
  try {
    const data = await apiGet("/dash/overview", { token });
    renderOwnerView(data, token);
  } catch (e) {
    if (e.message.includes("401")) {
      localStorage.removeItem(LS_KEY);
      return renderOwnerLogin();
    }
    app.innerHTML = `<div class="wrap"><div class="empty">❌ Erro: ${e.message}<br><br><button class="btn" onclick="localStorage.clear();location.reload()">Voltar ao login</button></div></div>`;
  }
}

function renderOwnerView(d, token) {
  const totalMB = (d.vendasHoje.mb / 1024).toFixed(2);
  const tenantsRows = (d.tenants || []).map((t) => {
    const dias = t.diasRestantes;
    let badgeCls = "ok", badgeTxt = `${dias}d`;
    if (!t.ativo) { badgeCls = "err"; badgeTxt = "inativo"; }
    else if (dias <= 3) { badgeCls = "err"; }
    else if (dias <= 7) { badgeCls = "warn"; }
    const mb = (t.vendasHoje.mb / 1024).toFixed(2);
    return `<tr class="tenant-row" onclick="verTenant('${encodeURIComponent(t.lid)}', '${token}')">
      <td><strong>${t.nome || "—"}</strong></td>
      <td><span class="badge ${badgeCls}">${badgeTxt}</span></td>
      <td>${dias} dias</td>
      <td>${t.grupos}</td>
      <td>${t.pedidos.pendentes}</td>
      <td><strong>${mb} GB</strong></td>
      <td><strong>${t.vendasHoje.mt} MT</strong></td>
    </tr>`;
  }).join("");

  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <div class="logo">📊 Owner <span>Dashboard</span></div>
        <div>
          <button class="btn secondary" onclick="loadOwnerData('${token}')">🔄 Atualizar</button>
          <button class="btn secondary" onclick="localStorage.clear();location.reload()">Sair</button>
        </div>
      </div>

      <div class="updated">Última atualização: ${new Date(d.timestamp || Date.now()).toLocaleTimeString("pt-PT")}</div>

      <div class="grid cards">
        <div class="card hl-blue">
          <div class="label">Tenants</div>
          <div class="value">${d.ativos}<span style="font-size:16px;color:#94a3b8"> / ${d.total}</span></div>
          <div class="sub">ativos / total</div>
        </div>
        <div class="card hl-amber">
          <div class="label">A expirar (7d)</div>
          <div class="value">${d.expirando}</div>
          <div class="sub">tenants</div>
        </div>
        <div class="card hl-green">
          <div class="label">Vendas hoje</div>
          <div class="value">${totalMB}<span style="font-size:14px;color:#94a3b8"> GB</span></div>
          <div class="sub">${d.vendasHoje.mt} MT faturados</div>
        </div>
        <div class="card">
          <div class="label">Pedidos pendentes</div>
          <div class="value">${d.pedidosPendentes}</div>
          <div class="sub">a aguardar processamento</div>
        </div>
      </div>

      <div class="section">
        <h2>🏆 Ranking de tenants (hoje)</h2>
        <table>
          <thead>
            <tr>
              <th>Tenant</th>
              <th>Estado</th>
              <th>Expira</th>
              <th>Grupos</th>
              <th>Pendentes</th>
              <th>Vendas MB</th>
              <th>Vendas MT</th>
            </tr>
          </thead>
          <tbody>${tenantsRows || `<tr><td colspan="7" class="empty">Nenhum tenant registado</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
}

window.verTenant = async function(lidEncoded, token) {
  const lid = decodeURIComponent(lidEncoded);
  app.innerHTML = `<div class="wrap"><div class="loading"><span class="spinner"></span>A carregar…</div></div>`;
  try {
    const d = await apiGet(`/dash/tenant/${encodeURIComponent(lid)}`, { token });
    renderTenantDetail(d, token, true);
  } catch (e) {
    app.innerHTML = `<div class="wrap"><div class="empty">❌ ${e.message}</div></div>`;
  }
};

// ═══════════════════════════════════════════════════════════
//   TENANT DASHBOARD
// ═══════════════════════════════════════════════════════════
async function renderTenant(token) {
  app.innerHTML = `<div class="wrap"><div class="loading"><span class="spinner"></span>A carregar…</div></div>`;
  try {
    const d = await apiGet("/dash/me", { token });
    renderTenantDetail(d, token, false);
  } catch (e) {
    if (e.message.includes("401")) {
      app.innerHTML = `<div class="wrap"><div class="empty">🔒 Link inválido ou expirado.<br>Pede ao bot um novo com <code>.gerardashboard</code></div></div>`;
      return;
    }
    app.innerHTML = `<div class="wrap"><div class="empty">❌ Erro: ${e.message}</div></div>`;
  }
}

function renderTenantDetail(d, token, isOwner) {
  const totalMB = (d.vendasHoje.mb / 1024).toFixed(2);
  const diasRestantes = d.diasRestantes;
  let badgeCls = "ok";
  if (!d.ativo) badgeCls = "err";
  else if (diasRestantes <= 3) badgeCls = "err";
  else if (diasRestantes <= 7) badgeCls = "warn";

  const ranking = (d.topCompradores || []).map((c, i) => {
    const mb = (c.totalMB / 1024).toFixed(2);
    return `<tr>
      <td class="rank-num">#${i + 1}</td>
      <td>${c.numero}</td>
      <td>${c.compras} compras</td>
      <td><strong>${mb} GB</strong></td>
    </tr>`;
  }).join("");

  const back = isOwner
    ? `<button class="btn secondary" onclick="location.reload()">← Voltar</button>`
    : "";

  const refresh = isOwner
    ? `onclick="verTenant('${encodeURIComponent(d.lid)}', '${token}')"`
    : `onclick="renderTenant('${token}')"`;

  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <div class="logo">📊 <span>${d.nome || "Meu Dashboard"}</span></div>
        <div>
          <button class="btn secondary" ${refresh}>🔄 Atualizar</button>
          ${back}
        </div>
      </div>

      <div class="grid cards">
        <div class="card hl-${badgeCls === "ok" ? "green" : badgeCls === "warn" ? "amber" : "red"}">
          <div class="label">Estado</div>
          <div class="value">${d.ativo ? "Ativo" : "Inativo"}</div>
          <div class="sub">${diasRestantes} dias restantes</div>
        </div>
        <div class="card">
          <div class="label">Vendas hoje</div>
          <div class="value">${totalMB}<span style="font-size:14px;color:#94a3b8"> GB</span></div>
          <div class="sub">${d.vendasHoje.mt} MT</div>
        </div>
        <div class="card">
          <div class="label">Pedidos</div>
          <div class="value">${d.pedidos.total}</div>
          <div class="sub">${d.pedidos.pendentes} pendentes · ${d.pedidos.finalizadosHoje} hoje</div>
        </div>
        <div class="card">
          <div class="label">Clientes</div>
          <div class="value">${d.totalCompradores}</div>
          <div class="sub">${d.grupos} grupos ativos</div>
        </div>
      </div>

      <div class="section">
        <h2>🏆 Top 5 Compradores</h2>
        ${ranking ? `<table><thead><tr><th></th><th>Número</th><th>Compras</th><th>Total</th></tr></thead><tbody>${ranking}</tbody></table>` : `<div class="empty">Sem compradores registados</div>`}
      </div>

      <div class="section">
        <h2>📅 Aluguer</h2>
        <table>
          <tr><td style="width:200px;color:#94a3b8">Expira em</td><td>${d.expiraEm ? new Date(d.expiraEm).toLocaleDateString("pt-PT") : "—"}</td></tr>
          <tr><td style="color:#94a3b8">Dias restantes</td><td><span class="badge ${badgeCls}">${diasRestantes} dias</span></td></tr>
          <tr><td style="color:#94a3b8">LID</td><td><code style="color:#93c5fd">${d.lid}</code></td></tr>
        </table>
      </div>
    </div>`;
}
</script>
</body>
</html>
